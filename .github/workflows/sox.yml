# Fill in market data for SOX预测 (docs/sox.html) and rebuild the page.
name: SOX Forecast

on:
  # The morning routine pushes data/sox/<date>.json: record the SOXX
  # pre-market move right away.
  push:
    branches: [main]
    paths: [data/sox/**, sox.py, .github/workflows/sox.yml]
  schedule:
    # Weekdays (UTC). 13:50: pre-market fallback (9:50 EDT / 8:50 EST).
    # 20:15 = 4:15 PM EDT and 21:15 = 4:15 PM EST, right after the 4 PM close
    # (a run before the close changes nothing); 22:20 is a backup.
    - cron: "50 13 * * 1-5"
    - cron: "15 20 * * 1-5"
    - cron: "15 21 * * 1-5"
    - cron: "20 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sox
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sox.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sox.html data/sox-market.json
          git diff --cached --quiet && exit 0
          git commit -m "sox: $(TZ=America/Toronto date '+%F %H:%M')"
          # The news routine and the CBC job push to main too; rebase and retry.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
